<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Vandana's Birthday Countdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.5em;
            color: #ff6b81;
            margin-bottom: 20px;
        }

        .timer-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
        }

        .time-box {
            background: #ff6b81;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 60px;
        }

        .time-box span {
            display: block;
            font-size: 0.5em;
            font-weight: normal;
            margin-top: 5px;
            text-transform: uppercase;
        }

        #birthday-message {
            display: none; /* Hidden until the timer hits zero */
        }

        #birthday-message p {
            font-size: 1.2em;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Countdown Section -->
        <div id="countdown-section">
            <h1>Countdown to AJ Vandana's Birthday! 🎉</h1>
            <div class="timer-wrapper" id="timer">
                <div class="time-box"><div id="days">0</div><span>Days</span></div>
                <div class="time-box"><div id="hours">0</div><span>Hours</span></div>
                <div class="time-box"><div id="minutes">0</div><span>Minutes</span></div>
                <div class="time-box"><div id="seconds">0</div><span>Seconds</span></div>
            </div>
        </div>

        <!-- Birthday Message Section -->
        <div id="birthday-message">
            <h1>Happy Birthday AJ Vandana! 🎂🎈</h1>
            <p>May you have a joyful and prosperous life ahead!</p>
        </div>
    </div>

    <script>
        // Set the date we're counting down to (September 10, 2026 at midnight)
        const countDownDate = new Date("Sep 10, 2026 00:00:00").getTime();

        // Update the countdown every 1 second
        const x = setInterval(function() {

            // Get today's date and time
            const now = new Date().getTime();

            // Find the distance between now and the countdown date
            const distance = countDownDate - now;

            // Time calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the results in the respective elements
            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

            // If the countdown is finished, hide the timer and show the birthday message
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown-section").style.display = "none";
                document.getElementById("birthday-message").style.display = "block";
            }
        }, 1000);
    </script>

</body>
</html>
